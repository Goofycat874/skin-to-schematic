<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn any Minecraft skin into a posed 3D statue and export it as a WorldEdit .schem, Litematica .litematic, or vanilla .mcfunction."
    />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9ece6" media="(prefers-color-scheme: light)" />
    <title>Skinforge: skin to schematic</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('skinforge:theme'))
        var theme = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
